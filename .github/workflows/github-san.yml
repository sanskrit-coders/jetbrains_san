name: Github-san tools

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-san

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build, test, and verify plugin
        run: gradle test buildPlugin verifyPlugin --no-daemon

      - name: Upload plugin archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-san-plugin
          path: github-san/build/distributions/*.zip

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: github-san

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build plugin archive
        run: gradle buildPlugin --no-daemon

      - name: Attach plugin ZIP to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber

      - name: Publish to JetBrains Marketplace (when configured)
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ]; then
            gradle publishPlugin --no-daemon
          else
            echo "JETBRAINS_MARKETPLACE_TOKEN secret not set; skipping Marketplace upload."
          fi
